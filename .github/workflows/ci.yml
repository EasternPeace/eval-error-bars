name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no moving major tags after v7, so pin the full version.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.11" # the version the Claude Cookbook's own CI uses
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # Offline: the statistics, the dataset, the runner against a fake client, the gate.
      - name: Test
        run: uv run pytest
