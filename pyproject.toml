[project]
name = "eval-error-bars"
version = "0.1.0"
description = "Claude Cookbook recipe: compare two prompts with paired evals and error bars"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
# Only packages the Claude Cookbook already depends on, so the recipe drops in unchanged.
dependencies = [
    "anthropic>=2.0.0",
    "matplotlib",
    "numpy",
    "pandas",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "ipykernel",
    "nbconvert",
    "nbformat",
    "pip>=26.3",
    "pytest",
    "ruff>=0.14.2",
]

[tool.uv]
package = false

# Lint and format settings mirror anthropics/claude-cookbooks so the recipe passes its CI.
[tool.ruff]
line-length = 100
target-version = "py311"
extend-include = ["*.ipynb"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "S", "B"]
ignore = [
    "E501", # line too long
    "S101", # assert used (ok in tests)
    "S311", # pseudo-random generators ok for non-crypto
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = [
    "E402", # imports mid-file
    "F811", # redefinitions (common in notebooks)
]

[tool.pytest.ini_options]
testpaths = ["evals", "tests"]
addopts = ["--tb=short", "-m", "not live"]
markers = ["live: calls the Claude API and costs money; run with `-m live`"]
